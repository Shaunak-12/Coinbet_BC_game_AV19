<div class="popupCard">
	<span class="popupClose" mat-dialog-close><i class="fa fa-times"></i></span>
	<div class="popupHead">
		<span>New Level Template Config</span>
	</div>
	<form [formGroup]="addForm"  (ngSubmit)="onSubmit()">
		<div class="row admin-add">
			<div class="col-sm-4">
				<mat-label>Wallet</mat-label>
				<mat-form-field style="width: 100%;" appearance="outline">
					<mat-select formControlName="WalletTypeId">
						<ng-container *ngFor="let option of userWals">
							<mat-option [value]="option.Id">{{option.Code}}</mat-option>
						</ng-container>
					</mat-select>
				</mat-form-field>
			</div>
			<div class="col-sm-4">
				<mat-label>Template</mat-label>
				<mat-form-field style="width: 100%;" appearance="outline">
					<mat-select formControlName="TemplateId">
						<ng-container *ngFor="let option of tmpOps">
							<mat-option [value]="option.value">{{option.name}}</mat-option>
						</ng-container>
					</mat-select>
				</mat-form-field>
			</div>
            <div class="col-sm-4">
				<mat-label>Features</mat-label>
				<mat-form-field style="width: 100%;" appearance="outline">
					<mat-select formControlName="FeaturesId">
                        <mat-option value="">Select</mat-option>
						<ng-container *ngFor="let option of feaArr">
							<mat-option [value]="option.value">{{option.name}}</mat-option>
						</ng-container>
					</mat-select>
				</mat-form-field>
			</div>
		</div>
		<div style="text-align: center;">
			<div *ngIf="adminPass" class="font7" style="margin: 1rem;">{{adminPass}}</div>
			<button type="button" class="mbutton btn btn-primary font7" mat-dialog-close (click)="onBack()">{{adminPass.length>0?'Close':'Cancel'}}</button>
			<button type="button" class="mbutton btn btn-primary font7" type="submit" [disabled]="submitDisabled || adminPass.length>0">Submit <i *ngIf="submitDisabled" class="fa fa-sync fa-spin"></i></button>
		</div>
	</form>
</div>
