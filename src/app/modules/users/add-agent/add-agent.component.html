<app-advance-title-head-new [showForm]="'true'" btnVal="Search" [titleText]="'All Agents'" [dynamicForm]="dynamicControls" (onSubmitForm)="getSearchQuery($event)"></app-advance-title-head-new>
<div class="card" style="margin: 10px;padding: 1rem;">
  <app-advance-table [DataLoader]="addadminloader.getAllAdmins || addadminloader.getAdminRoles" [TableCollumnData]="AdminDataCollumns" [TableData]="AdmininfoData" (onInputChange)="onValueChange($event)"></app-advance-table>
  <app-advance-table-paginator posn="bottom" [DataLoader]="addadminloader.getAllAdmins" [paginatorBlock]="paginatorBlock" [pageNo]="currentQuery.PageNo" [rowCount]="rowCount" [pageCount]="pageCount" [selectedPageCount]="currentQuery.PageSize" [pagesTotal]="pagesTotal" (onPaginatorChange)="onPaginatorChange($event)"></app-advance-table-paginator>
</div>
<ng-template #AddAdminDialogOpen>
  <app-status-change (onSave)="closeAll()" [userData]="adminData"></app-status-change>
</ng-template>
