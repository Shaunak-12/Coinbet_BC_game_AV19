<app-multi-input-header [showWallets]="false" [titleText]="'Deposit Promotions'" [dynamicForm]="dynamicControls" [showForm]="'true'" btnVal="Search" (onSubmitForm)="getSearchQuery($event)"></app-multi-input-header>
<div class="card" style="margin: 10px;padding: 1rem;">
  <div style="padding: 0rem 0.5rem 0.5rem 0.5rem">
    <button type="button" class="btn btn-primary font7" style="margin-left: 1rem; float: right;" (click)="openPopup()">Add</button>
  </div>
  <app-advance-table [DataLoader]="PGCollumnLoading" [TableCollumnData]="PGDataCollumns" [TableData]="PGinfoData" (onInputChange)="onValueChange($event)"></app-advance-table>
</div>
<ng-template #addForm>
  <app-newdepopromo (onSave)="GetAllPG()" (onCancel)="closePopup()"></app-newdepopromo>
</ng-template>
