<app-advance-title-head-new [showForm]="'true'" btnVal="Search" [titleText]="'User Bonus'"
    [dynamicForm]="dynamicControls" (onSubmitForm)="getSearchQuery($event)"></app-advance-title-head-new>
<div class="card" style="margin: 10px;padding: 1rem;">
    <div style="padding: 0rem 0.5rem 0.5rem 0.5rem; float: right;" class="wrc-mat" *ngIf="rUsersRows.length>0">
        <button type="button" class="btn btn-primary font7" (click)="downLoad()" [disabled]="apiLoader.rlc_export">Export&nbsp;<i *ngIf="apiLoader.rlc_export" class="fa fa-sync fa-spin"></i></button>
    </div>
    <app-advance-table-paginator posn="top" [DataLoader]="apiLoader.rlc_list" [paginatorBlock]="paginatorBlock"
        [pageNo]="currentQuery.Pagination" [rowCount]="rowCount" [pageCount]="pageCount"
        [selectedPageCount]="currentQuery.PageSize" [pagesTotal]="pagesTotal"
        (onPaginatorChange)="onPaginatorChange($event)"></app-advance-table-paginator>
    <app-advance-table [DataLoader]="apiLoader.rlc_list" [rowCount]="rowCount" [TableCollumnData]="rUsersCollumns"
        [TableData]="rUsersRows" (onInputChange)="onValueChange($event)"></app-advance-table>
    <app-advance-table-paginator posn="bottom" [DataLoader]="apiLoader.rlc_list" [paginatorBlock]="paginatorBlock"
        [pageNo]="currentQuery.Pagination" [rowCount]="rowCount" [pageCount]="pageCount"
        [selectedPageCount]="currentQuery.PageSize" [pagesTotal]="pagesTotal"
        (onPaginatorChange)="onPaginatorChange($event)"></app-advance-table-paginator>
</div>
