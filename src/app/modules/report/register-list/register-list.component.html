<app-title-header [showExport]="true" (onExport)="DownloadRegisteredUsersData()" [exportLoader]="apiLoader.rlc_export" titleText="Registered List" searchType="customSearch" [startEndDates]="dateValue" [searchOptions]="searchOptions" [searchHasInputOption1]="true" [searchHasOption]="true" [maxDate]="todayDate" [searchButton]="true" (onSearch)="searchRegistered($event)"></app-title-header>
<div class="card" style="margin: 10px;padding: 1rem;">
  <app-advance-table-paginator posn="top" [DataLoader]="apiLoader.rlc_list" [paginatorBlock]="paginatorBlock" [pageNo]="currentQuery.PageNo" [rowCount]="rowCount" [pageCount]="pageCount" [selectedPageCount]="currentQuery.PageSize" [pagesTotal]="pagesTotal" (onPaginatorChange)="onPaginatorChange($event)"></app-advance-table-paginator>
  <app-advance-table [DataLoader]="apiLoader.rlc_list" [rowCount]="rowCount" [TableCollumnData]="rUsersCollumns" [TableData]="rUsersRows" (onInputChange)="onValueChange($event)"></app-advance-table>
  <app-advance-table-paginator posn="bottom" [DataLoader]="apiLoader.rlc_list" [paginatorBlock]="paginatorBlock" [pageNo]="currentQuery.PageNo" [rowCount]="rowCount" [pageCount]="pageCount" [selectedPageCount]="currentQuery.PageSize" [pagesTotal]="pagesTotal" (onPaginatorChange)="onPaginatorChange($event)"></app-advance-table-paginator>
</div>
